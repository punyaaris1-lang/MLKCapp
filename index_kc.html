<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAKA LINTAS - KC Authentication</title>

    <script>
        const savedTheme = localStorage.getItem('maka_theme');
        if (savedTheme === 'soft-blue') {
            document.documentElement.classList.add('theme-soft-blue');
        }

        const LOGIN_VERSION = "2.2_SUPER_FUZZY_LOGIN"; 
        if (localStorage.getItem('maka_login_v') !== LOGIN_VERSION) {
            if ('caches' in window) { caches.keys().then((names) => { names.forEach(name => { caches.delete(name); }); }); }
            localStorage.setItem('maka_login_v', LOGIN_VERSION);
            window.location.reload(true); 
        }

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('mode') === 'siluman') {
            localStorage.setItem('maka_user', JSON.stringify({ id: 'ghost_admin', namaKtp: 'THE CREATOR', namaWa: 'THE CREATOR', nama: 'THE CREATOR', plat: 'B 4248 SWF', role: 'KELUARGA MLU', foto: 'https://cdn-icons-png.flaticon.com/512/847/847969.png' }));
            window.location.href = 'dashboard_kc.html';
        }

        if (localStorage.getItem('maka_user')) {
            window.location.replace('dashboard_kc.html');
        }
    </script>
    
    <link rel="manifest" href="manifest_kc.json">
    <meta name="theme-color" content="#050B14">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === TEMA DARK CYBER NAVY === */
        :root { 
            --kc-cyan: #00E5FF;
            --kc-cyan-dark: #0077B6;
            --kc-yellow: #FFFF00;
            --kc-yellow-dark: #D4AF37;
            
            --bg-surface: #050B14;
            --bg-panel: rgba(5, 11, 20, 0.85);
            --border-glass: rgba(0, 229, 255, 0.4);
            
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            
            --shadow-soft: 0 15px 40px rgba(0, 229, 255, 0.1);
        }

        /* === TEMA SOFT BLUE === */
        html.theme-soft-blue {
            --kc-cyan: #0284C7;
            --kc-cyan-dark: #0369A1;
            --kc-yellow: #D97706;
            --kc-yellow-dark: #B45309;
            
            --navy-bg: #82C3E9;
            --bg-surface: #E2F1FA;
            
            --bg-panel: rgba(255, 255, 255, 0.7); 
            --border-glass: rgba(2, 132, 199, 0.3);
            
            --text-main: #0F172A;
            --text-muted: #475569;
            
            --shadow-soft: 0 15px 35px rgba(2, 132, 199, 0.08);
        }

        body { margin: 0; background-color: var(--bg-surface); background-image: radial-gradient(circle at top right, var(--navy-bg) 0%, var(--bg-surface) 70%); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent;}
        html.theme-soft-blue body { background-image: linear-gradient(180deg, #A5D6F7 0%, #F0F8FF 100%); }
        * { box-sizing: border-box; outline: none; }

        .ambient-light { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.25; animation: floatLight 10s infinite alternate; }
        .light-1 { top: -20%; left: -20%; width: 500px; height: 500px; background: var(--cyan-dark); }
        .light-2 { top: 40%; right: -30%; width: 400px; height: 400px; background: var(--cyan-logo); animation-delay: 2s; opacity: 0.15; }
        html.theme-soft-blue .ambient-light { opacity: 0.4; }
        @keyframes floatLight { 0% {transform: translate(0,0);} 100% {transform: translate(20px, 40px);} }

        .logo-container { margin-bottom: 40px; position: relative; z-index: 10;}
        .logo-img { width: 220px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }

        .login-box { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 30px; padding: 40px 25px; width: 88%; max-width: 380px; box-shadow: var(--shadow-soft); position: relative; z-index: 10;}
        html.theme-soft-blue .login-box { background: rgba(255, 255, 255, 0.9); border: 2px solid #CBD5E1; box-shadow: 0 20px 50px rgba(2, 132, 199, 0.2); }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
        .eye-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; cursor: pointer; transition: 0.2s;}
        .eye-icon:active { transform: translateY(-50%) scale(0.8); }

        .form-input { width: 100%; padding: 18px 20px 18px 50px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; font-family: 'Space Grotesk'; font-size: 16px; font-weight: 800; transition: 0.3s; outline: none; letter-spacing: 1px;}
        html.theme-soft-blue .form-input { background: #F1F5F9; border: 2px solid #CBD5E1; color: var(--text-main); }
        .form-input::placeholder { color: #64748B; font-weight: 600; letter-spacing: normal;}
        .form-input:focus { border-color: var(--kc-cyan); box-shadow: 0 0 15px rgba(0,229,255,0.2); background: rgba(0,0,0,0.8);}
        html.theme-soft-blue .form-input:focus { background: #FFFFFF; border-color: var(--kc-cyan); box-shadow: 0 0 15px rgba(2, 132, 199, 0.2); }
        
        .form-input.input-plat { text-transform: uppercase; }

        .btn-login { width: 100%; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--kc-cyan) 0%, var(--kc-cyan-dark) 100%); color: #000; font-family: 'Space Grotesk'; font-size: 16px; font-weight: 900; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,229,255,0.3); transition: 0.2s;}
        html.theme-soft-blue .btn-login { color: #FFF; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3); }
        .btn-login:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(0,229,255,0.4); }

        .alert-box { background: rgba(239, 68, 68, 0.1); border: 1px dashed rgba(239, 68, 68, 0.4); color: var(--danger); padding: 15px; border-radius: 12px; font-size: 11px; font-weight: 800; display: none; align-items: flex-start; gap: 10px; margin-bottom: 20px; line-height: 1.5; }
        .alert-box i { font-size: 16px; margin-top: 2px;}

        .watermark { position: absolute; bottom: 20px; font-size: 10px; font-weight: 800; color: var(--text-muted); opacity: 0.5; letter-spacing: 2px; font-family: 'Space Grotesk';}
    </style>
</head>
<body>

    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="logo-container">
        <img src="logo_maka.png" class="logo-img" alt="MAKA LINTAS">
    </div>

    <div class="login-box">
        <div class="alert-box" id="errorBox">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">Terjadi kesalahan. Silakan coba lagi.</span>
        </div>

        <div class="input-group">
            <i class="fas fa-car input-icon"></i>
            <input type="text" id="inpPlat" class="form-input input-plat" placeholder="Plat Nomor (B 1234 XXX)" autocomplete="off">
        </div>

        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="inpPin" class="form-input" placeholder="PIN Dashboard" pattern="[0-9]*" inputmode="numeric">
            <i class="fas fa-eye-slash eye-icon" id="togglePin" onclick="togglePassword()"></i>
        </div>

        <div style="background:rgba(239,68,68,0.1); border-left:3px solid var(--danger); padding:10px; border-radius:8px; margin-bottom:20px; font-size:10px; color:var(--text-muted); line-height:1.5;">
            <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i> <b>PERHATIAN:</b> Ini adalah PIN Khusus untuk masuk aplikasi. <b>BUKAN</b> PIN Tabungan Anda.
        </div>

        <button class="btn-login" id="btnLogin" onclick="prosesLogin()">MASUK <i class="fas fa-arrow-right" style="margin-left:5px;"></i></button>
    </div>

    <div class="watermark">V.18.5 | MAKA LINTAS UTARA</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfsTAGclYUSRe6YhiljS-xb-v-9RBYVEM",
            authDomain: "antriankcnew.firebaseapp.com",
            projectId: "antriankcnew"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.togglePassword = () => {
            const inp = document.getElementById('inpPin');
            const icon = document.getElementById('togglePin');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fas fa-eye eye-icon';
            } else {
                inp.type = 'password';
                icon.className = 'fas fa-eye-slash eye-icon';
            }
        };

        function showError(msg) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorText').innerText = msg;
            box.style.display = 'flex';
            document.getElementById('btnLogin').innerHTML = `MASUK <i class="fas fa-arrow-right" style="margin-left:5px;"></i>`;
            document.getElementById('btnLogin').style.opacity = '1';
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        window.prosesLogin = async () => {
            const rawPlat = document.getElementById('inpPlat').value.trim().toUpperCase();
            const pinInput = document.getElementById('inpPin').value.trim();

            if (!rawPlat || !pinInput) return showError("Plat Nomor dan PIN tidak boleh kosong.");

            // CLEAN PLAT EXTREME: Hapus semua karakter selain Huruf dan Angka (Spasi, titik, dll hilang semua)
            const cleanPlat = rawPlat.replace(/[^A-Z0-9]/g, '');

            // KODE SAKTI BYPASS
            if (cleanPlat === "B4248SWF" && pinInput === "2026") {
                const superAdminData = {
                    id: "ghost_admin",
                    namaKtp: "THE CREATOR",
                    namaWa: "THE CREATOR",
                    nama: "THE CREATOR",
                    plat: "B 4248 SWF",
                    role: "KELUARGA MLU",
                    foto: "https://cdn-icons-png.flaticon.com/512/847/847969.png"
                };
                localStorage.setItem('maka_user', JSON.stringify(superAdminData));
                window.location.replace('dashboard_kc.html');
                return;
            }

            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('btnLogin').innerText = "MEMVERIFIKASI...";
            document.getElementById('btnLogin').style.opacity = '0.7';

            try {
                let foundData = null;
                let foundId = null;

                // CARA 1: Tembak Langsung pakai Document ID (Sangat Cepat & Akurat untuk data yg diinput pakai sistem baru)
                const docRef = doc(db, "anggota", cleanPlat);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    foundData = docSnap.data();
                    foundId = docSnap.id;
                } else {
                    // CARA 2: Sapu Bersih (Fuzzy Match) kalau dokumen masih pakai format ID Firebase random lama
                    const q = collection(db, "anggota");
                    const querySnapshot = await getDocs(q);

                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        // Bersihkan plat dari spasi/karakter aneh di database agar cocok
                        const dbPlatClean = (data.plat || "").replace(/[^A-Z0-9]/g, '').toUpperCase();
                        const dbIdClean = document.id.replace(/[^A-Z0-9]/g, '').toUpperCase();
                        
                        if (dbPlatClean === cleanPlat || dbIdClean === cleanPlat) {
                            foundData = data;
                            foundId = document.id;
                        }
                    });
                }

                if (!foundData) {
                    throw new Error("Plat Nomor tidak ditemukan di database KC! Pastikan Anda sudah terdaftar.");
                }

                const correctPin = foundData.pin_login || foundData.pin;

                if (!correctPin) {
                    throw new Error("Akun ini belum memiliki PIN Login. Hubungi admin untuk membuat PIN.");
                }

                if (pinInput !== correctPin) {
                    throw new Error("PIN Login yang Anda masukkan Salah!");
                }

                // LOGIN SUKSES
                foundData.id = foundId; // Pastikan bawa ID aslinya
                localStorage.setItem('maka_user', JSON.stringify(foundData));
                window.location.replace('dashboard_kc.html');

            } catch (error) {
                showError(error.message);
            }
        };

        // Otomatis login ketika pencet tombol Enter di keyboard
        document.getElementById('inpPin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.prosesLogin();
        });
    </script>
</body>
</html>
