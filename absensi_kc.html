<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KC - Scanner Absensi</title>

    <script>
        const savedTheme = localStorage.getItem('maka_theme');
        if (savedTheme === 'soft-blue') {
            document.documentElement.classList.add('theme-soft-blue');
        }

        const ABSEN_VERSION = "2.0_KC_EDITION"; 
        if (localStorage.getItem('maka_absen_kc_v') !== ABSEN_VERSION) {
            if ('caches' in window) { caches.keys().then((names) => { names.forEach(name => { caches.delete(name); }); }); }
            localStorage.setItem('maka_absen_kc_v', ABSEN_VERSION);
            window.location.reload(true); 
        }

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('mode') === 'siluman') {
            localStorage.setItem('maka_user', JSON.stringify({ id: 'ghost_admin', namaKtp: 'THE CREATOR', namaWa: 'THE CREATOR', nama: 'THE CREATOR', plat: 'B 4248 SWF', role: 'KELUARGA MLU', foto: 'https://cdn-icons-png.flaticon.com/512/847/847969.png' }));
            window.location.href = 'absensi_kc.html';
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;800;900&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* === TEMA CYBER NAVY & CYAN === */
        :root { 
            --kc-cyan: #00E5FF;     
            --kc-cyan-dark: #0077B6;     
            --kc-yellow: #FFFF00;   
            --kc-yellow-dark: #D4AF37;   
            --navy-bg: #050B14;       
            --bg-surface: #000000;    
            --bg-panel: rgba(5, 11, 20, 0.85);
            --border-glass: rgba(0, 229, 255, 0.25);
            
            --white: #FFFFFF; 
            --text-main: #F8FAFC; 
            --text-muted: #94A3B8; 
            --danger: #EF4444; 
            --success: #10B981; 
            --warning: #F59E0B;
            
            --shadow-cyan: 0 10px 30px rgba(0, 229, 255, 0.15);
        }

        /* === TEMA SOFT BLUE === */
        html.theme-soft-blue {
            --kc-cyan: #0284C7;
            --kc-cyan-dark: #0369A1;
            --kc-yellow: #D97706;
            --kc-yellow-dark: #B45309;
            --navy-bg: #E0F2FE;
            --bg-surface: #F8FAFC;
            --bg-panel: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(2, 132, 199, 0.3);

            --white: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            
            --shadow-cyan: 0 10px 30px rgba(2, 132, 199, 0.15);
        }
        
        body { margin: 0; background-color: var(--bg-surface); background-image: radial-gradient(circle at top right, var(--navy-bg) 0%, var(--bg-surface) 70%); font-family: 'Inter', sans-serif; color: var(--text-main); padding-bottom: 120px; overflow-x: hidden; position: relative; min-height: 100vh;}
        * { box-sizing: border-box; outline: none; }

        .ambient-light { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.25; animation: floatLight 10s infinite alternate; }
        .light-1 { top: -20%; left: -20%; width: 500px; height: 500px; background: var(--kc-cyan-dark); }
        .light-2 { top: 40%; right: -30%; width: 400px; height: 400px; background: var(--success); animation-delay: 2s; opacity: 0.15; }
        html.theme-soft-blue .ambient-light { opacity: 0.5; }
        @keyframes floatLight { 0% {transform: translate(0,0);} 100% {transform: translate(20px, 40px);} }

        /* --- HEADER --- */
        .header-premium { background: linear-gradient(160deg, var(--navy-bg) 0%, #000 100%); padding: 50px 20px 70px; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; color: white; text-align: center; position: relative; z-index: 10; box-shadow: var(--shadow-cyan); border-bottom: 1px solid var(--border-glass);}
        html.theme-soft-blue .header-premium { background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 100%); color: var(--text-main); }
        
        .sub-tag { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--success); text-transform: uppercase; margin-bottom: 4px; display: block; text-shadow: 0 0 10px rgba(16,185,129,0.5); }
        html.theme-soft-blue .sub-tag { text-shadow: none; color: var(--kc-cyan-dark); }
        .main-title { font-family: 'Outfit'; font-size: 28px; font-weight: 900; margin: 0; line-height: 1.1; }

        /* --- AREA KONTEN --- */
        .content-area { padding: 0 20px; margin-top: -40px; position: relative; z-index: 11;}
        
        /* KOTAK SCANNER */
        .scan-card { background: var(--bg-panel); backdrop-filter: blur(15px); padding: 25px 20px; border-radius: 28px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid var(--border-glass); margin-bottom: 25px;}
        html.theme-soft-blue .scan-card { background: #FFFFFF; box-shadow: var(--shadow-cyan); border-color: var(--kc-cyan); }
        
        .event-input { width: 100%; padding: 16px; border: 2px dashed rgba(0,229,255,0.4); border-radius: 16px; font-family: 'Space Grotesk'; font-weight: 900; font-size: 16px; text-align: center; color: var(--kc-cyan); background: rgba(0,0,0,0.5); margin-bottom: 15px; text-transform: uppercase; outline: none; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,229,255,0.1);}
        html.theme-soft-blue .event-input { background: #F8FAFC; color: var(--text-main); border-color: var(--kc-cyan); box-shadow: none; }
        .event-input:focus { border-color: var(--kc-cyan); background: rgba(0,229,255,0.05); box-shadow: 0 0 15px rgba(0,229,255,0.3); color: white;}
        html.theme-soft-blue .event-input:focus { background: #FFFFFF; color: var(--kc-cyan); }

        #reader { width: 100%; border-radius: 18px; overflow: hidden; border: 2px solid #222 !important; box-shadow: 0 10px 20px rgba(0,0,0,0.5); background: #000; padding: 10px;}
        html.theme-soft-blue #reader { border-color: #CBD5E1 !important; background: #F8FAFC; box-shadow: none; }
        #reader__dashboard_section_csr span { font-family: 'Inter'; font-weight: bold; color: var(--text-main); }
        #reader__dashboard_section_swaplink { display: none; } 
        #reader button { background: var(--kc-cyan); color: black; border: none; padding: 12px 20px; border-radius: 12px; font-family: 'Space Grotesk'; font-weight: 900; cursor: pointer; margin-top: 15px; transition: 0.2s; letter-spacing: 1px; box-shadow: var(--shadow-cyan);}
        html.theme-soft-blue #reader button { color: #FFF; }
        #reader button:active { transform: scale(0.95); }

        /* DAFTAR ABSENSI */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px;}
        .list-title { font-family: 'Outfit'; font-size: 18px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        .list-title i { color: var(--success); }
        .badge-count { background: rgba(16,185,129,0.1); color: var(--success); padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 900; font-family: 'Space Grotesk'; border: 1px solid rgba(16,185,129,0.3);}

        .absen-list-container { display: flex; flex-direction: column; gap: 10px; }
        .absen-item { background: rgba(5,11,20,0.8); backdrop-filter: blur(10px); padding: 16px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-left: 4px solid var(--success); animation: slideIn 0.3s ease-out;}
        html.theme-soft-blue .absen-item { background: #FFFFFF; border: 1px solid #CBD5E1; border-left: 4px solid var(--success); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        @keyframes slideIn { from {opacity:0; transform:translateX(-20px);} to {opacity:1; transform:translateX(0);} }
        
        .ab-left { display: flex; flex-direction: column; }
        .ab-name { font-family: 'Outfit'; font-size: 16px; font-weight: 900; color: var(--text-main); margin-bottom: 4px;}
        .ab-plat { font-family: 'Space Grotesk'; font-size: 12px; font-weight: 900; color: var(--kc-cyan); letter-spacing: 1px;}
        html.theme-soft-blue .ab-plat { color: var(--kc-cyan-dark); }
        .ab-time { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 5px;}
        
        .ab-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(16,185,129,0.1); color: var(--success); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid rgba(16,185,129,0.2); box-shadow: inset 0 0 10px rgba(16,185,129,0.1);}

        /* BOTTOM NAV */
        .back-nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 350px; z-index: 1000;}
        .btn-premium-back { background: var(--bg-panel); backdrop-filter: blur(15px); border: 1px solid var(--border-glass); padding: 16px; border-radius: 50px; font-family: 'Space Grotesk'; font-weight: 900; font-size: 13px; color: var(--kc-cyan); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: var(--shadow-cyan); transition: 0.2s;}
        html.theme-soft-blue .btn-premium-back { background: #FFFFFF; border-color: var(--kc-cyan); }
        .btn-premium-back:active { transform: scale(0.95); }

        /* MODAL ALERT */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-box { background: var(--navy-bg); width: 100%; max-width: 350px; border-radius: 25px; padding: 30px 25px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.9); animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--kc-cyan);}
        html.theme-soft-blue .modal-box { background: #FFFFFF; border-color: transparent; box-shadow: 0 20px 60px rgba(2, 132, 199, 0.3); }
        @keyframes zoomIn { from {transform:scale(0.8); opacity:0;} to {transform:scale(1); opacity:1;} }
        
        .modal-icon { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid transparent;}
        .m-sukses { background: rgba(16,185,129,0.1); color: var(--success); box-shadow: 0 0 30px rgba(16,185,129,0.3); border-color: rgba(16,185,129,0.5); }
        .m-warning { background: rgba(245,158,11,0.1); color: var(--warning); box-shadow: 0 0 30px rgba(245,158,11,0.3); border-color: rgba(245,158,11,0.5); }
        .m-gagal { background: rgba(239,68,68,0.1); color: var(--danger); box-shadow: 0 0 30px rgba(239,68,68,0.3); border-color: rgba(239,68,68,0.5); }
        
        .modal-title { font-family: 'Outfit'; font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 10px;}
        .modal-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; font-weight: 600;}
        .btn-close-modal { width: 100%; padding: 16px; border: none; border-radius: 16px; font-family: 'Space Grotesk'; font-weight: 900; font-size: 14px; cursor: pointer; color: black; letter-spacing: 1px; transition: 0.2s;}
        .btn-close-modal:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="header-premium">
        <span class="sub-tag"><i class="fas fa-satellite-dish"></i> Database Kehadiran</span>
        <h1 class="main-title"><i class="fas fa-qrcode"></i> SCAN ABSENSI</h1>
    </div>

    <div class="content-area">
        <div class="scan-card">
            <div style="font-size: 10px; color: var(--text-muted); font-weight: 800; margin-bottom: 5px; text-transform: uppercase; text-align: left;">Nama Acara / Event:</div>
            <input type="text" id="eventName" class="event-input" placeholder="NAMA ACARA (Cth: KOPDAR MARET)" value="KOPDAR KC">
            
            <div style="font-size: 11px; color: var(--kc-cyan); font-weight: 800; margin-bottom: 15px; margin-top: 10px; background: rgba(0,229,255,0.1); padding: 8px; border-radius: 8px; border: 1px dashed rgba(0,229,255,0.3);"><i class="fas fa-camera"></i> Arahkan Kamera ke QR Code Member</div>
            
            <div id="reader"></div>
        </div>

        <div class="list-header">
            <div class="list-title"><i class="fas fa-clipboard-list"></i> Riwayat Hadir</div>
            <div class="badge-count" id="totalHadir">0 Orang</div>
        </div>

        <div class="absen-list-container" id="absenListBody">
            <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:12px; background:var(--bg-panel); border-radius:20px; border:1px dashed var(--border-glass);">Belum ada member yang di-scan.</div>
        </div>
    </div>

    <div class="back-nav"><a href="dashboard_kc.html" class="btn-premium-back"><i class="fas fa-arrow-left"></i> KEMBALI KE DASHBOARD</a></div>

    <div class="modal-overlay" id="alertModal">
        <div class="modal-box">
            <div class="modal-icon" id="alertIcon"><i class="fas fa-check"></i></div>
            <div class="modal-title" id="alertTitle">Sukses</div>
            <div class="modal-msg" id="alertMsg">Data absensi berhasil disimpan.</div>
            <button class="btn-close-modal" id="alertBtn" onclick="tutupAlert()">LANJUT SCAN</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // KONEKSI FIREBASE KC MURNI (antriankcnew)
        const firebaseConfig = {
            apiKey: "AIzaSyDfsTAGclYUSRe6YhiljS-xb-v-9RBYVEM",
            authDomain: "antriankcnew.firebaseapp.com",
            projectId: "antriankcnew"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        // PROTEKSI HALAMAN: HANYA PENGURUS
        let uData = null;
        try { uData = JSON.parse(localStorage.getItem('maka_user')); } catch (e) {}
        
        if (!uData || !uData.plat) {
            window.location.href = 'index_kc.html'; 
        } else {
            const role = (uData.role || "").toUpperCase();
            const plat = (uData.plat || "").replace(/\s+/g, '').toUpperCase();
            
            // Cek Super Admin atau Jajaran Pengurus (Bukan Member Biasa)
            const isUserDewa = (plat === 'B4248SWF' || uData.id === 'ghost_admin');
            const isPengurus = isUserDewa || (role !== 'MEMBER' && role !== 'KELUARGA MLU' && role !== 'GUEST' && role !== 'NON-MEMBER');
            
            if (!isPengurus) {
                alert("AKSES DITOLAK! Halaman ini khusus Pengurus KC untuk melakukan scan absensi.");
                window.location.href = 'dashboard_kc.html';
            }
        }

        let isScanningPaused = false;
        let html5QrcodeScanner;

        document.addEventListener('DOMContentLoaded', () => {
            // INIT KAMERA SCANNER
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            
            // LOAD DATA ABSEN HARI INI
            loadAbsensiHariIni();
        });

        async function onScanSuccess(decodedText, decodedResult) {
            if (isScanningPaused) return;
            isScanningPaused = true; // Pause scanner biar gak scan dobel

            const eventName = document.getElementById('eventName').value.trim() || "KOPDAR KC";
            const cleanId = decodedText.replace(/\s+/g, '').toUpperCase(); // Ini adalah ID (Plat / ID Unik) dari QR

            document.getElementById('alertIcon').className = "modal-icon m-sukses";
            document.getElementById('alertIcon').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            document.getElementById('alertTitle').innerText = "Memproses...";
            document.getElementById('alertMsg').innerText = "Sedang mencari data member di database KC...";
            document.getElementById('alertBtn').style.background = "var(--text-muted)";
            document.getElementById('alertBtn').innerText = "TUNGGU";
            document.getElementById('alertModal').style.display = 'flex';

            try {
                // 1. CEK APAKAH SUDAH ABSEN DI ACARA INI HARI INI
                const todayStr = new Date().toLocaleDateString('id-ID');
                const qCek = query(collection(db, "absensi_kc"), 
                    where("memberId", "==", cleanId), 
                    where("event", "==", eventName),
                    where("dateString", "==", todayStr)
                );
                const cekSnap = await getDocs(qCek);
                
                if (!cekSnap.empty) {
                    showModalResult("m-warning", "fa-exclamation-triangle", "SUDAH ABSEN", `Member dengan ID <b>${cleanId}</b> sudah absen untuk acara ini hari ini.`, "var(--warning)");
                    return;
                }

                // 2. CARI NAMA MEMBER DI DATABASE KC (Koleksi "anggota")
                let namaMember = "MEMBER KC";
                let platAsli = decodedText;
                
                const qMember = query(collection(db, "anggota"));
                const memSnap = await getDocs(qMember);
                memSnap.forEach(doc => {
                    const data = doc.data();
                    // Cocokkan plat (tanpa spasi) atau ID dokumen
                    if ((data.plat && data.plat.replace(/\s+/g, '').toUpperCase() === cleanId) || doc.id === cleanId) {
                        namaMember = data.namaKtp || data.namaWa || data.nama || "Member KC";
                        platAsli = data.plat || decodedText;
                    }
                });

                // 3. SIMPAN KE DATABASE ABSENSI KC
                await addDoc(collection(db, "absensi_kc"), {
                    memberId: cleanId,
                    nama: namaMember,
                    plat: platAsli,
                    event: eventName,
                    dateString: todayStr,
                    timestamp: Date.now(),
                    scanBy: uData.namaKtp || uData.namaWa || "Admin KC"
                });

                showModalResult("m-sukses", "fa-check", "ABSEN BERHASIL", `<b style="color:var(--text-main); font-size:16px;">${namaMember}</b><br><span style="color:var(--kc-cyan); font-family:'Space Grotesk'; font-weight:900;">${platAsli}</span><br><br>Berhasil hadir di acara ${eventName}.`, "var(--success)");
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Getar sukses

            } catch (error) {
                showModalResult("m-gagal", "fa-times", "ERROR SISTEM", "Terjadi kesalahan: " + error.message, "var(--danger)");
            }
        }

        function onScanFailure(error) {
            // Abaikan error saat sedang mencari QR (normal terjadi tiap frame)
        }

        function showModalResult(iconClass, iconFa, title, msg, btnColor) {
            document.getElementById('alertIcon').className = `modal-icon ${iconClass}`;
            document.getElementById('alertIcon').innerHTML = `<i class="fas ${iconFa}"></i>`;
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerHTML = msg;
            document.getElementById('alertBtn').style.background = btnColor;
            document.getElementById('alertBtn').innerText = "LANJUT SCAN BERIKUTNYA";
        }

        window.tutupAlert = () => {
            document.getElementById('alertModal').style.display = 'none';
            // Resume scanner setelah delay 1 detik biar nggak langsung scan ulang ga sengaja
            setTimeout(() => { isScanningPaused = false; }, 1000);
        };

        // RENDER LIVE DATA ABSENSI DARI FIREBASE KC
        function loadAbsensiHariIni() {
            const todayStr = new Date().toLocaleDateString('id-ID');
            
            const qAbsen = query(collection(db, "absensi_kc"), where("dateString", "==", todayStr));
            onSnapshot(qAbsen, (snap) => {
                const list = document.getElementById('absenListBody');
                let count = 0;
                let htmlStr = '';
                
                let dataArr = [];
                snap.forEach(doc => dataArr.push(doc.data()));
                dataArr.sort((a, b) => b.timestamp - a.timestamp); // Urutkan dari yg terbaru

                dataArr.forEach(d => {
                    const timeStr = new Date(d.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                    count++;
                    htmlStr += `
                    <div class="absen-item">
                        <div class="ab-left">
                            <div class="ab-name">${d.nama}</div>
                            <div class="ab-plat"><i class="fas fa-car"></i> ${d.plat}</div>
                            <div class="ab-time"><i class="fas fa-clock"></i> ${timeStr} WIB &nbsp;•&nbsp; ${d.event}</div>
                        </div>
                        <div class="ab-icon"><i class="fas fa-check-circle"></i></div>
                    </div>`;
                });

                document.getElementById('totalHadir').innerText = `${count} Orang`;
                
                if (count > 0) {
                    list.innerHTML = htmlStr;
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:12px; background:var(--bg-panel); border-radius:20px; border:1px dashed var(--border-glass);">Belum ada member yang absen hari ini.</div>`;
                }
            });
        }
    </script>
</body>
</html>
