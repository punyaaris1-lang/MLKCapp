<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KC - Directory Anggota</title>

    <script>
        // ==========================================
        // 1. SISTEM BACA TEMA ANTI-KEDIP (FOUC PREVENTION)
        // ==========================================
        const savedTheme = localStorage.getItem('maka_theme');
        if (savedTheme === 'soft-blue') {
            document.documentElement.classList.add('theme-soft-blue');
        }

        // ==========================================
        // 2. SISTEM AUTO-UPDATE PAKSA (PENGHANCUR CACHE)
        // ==========================================
        const DATA_VERSION = "3.6_FAST_LOAD_KODE"; 
        if (localStorage.getItem('maka_data_version') !== DATA_VERSION) {
            if ('caches' in window) {
                caches.keys().then((names) => { names.forEach(name => { caches.delete(name); }); });
            }
            localStorage.setItem('maka_data_version', DATA_VERSION);
            window.location.reload(true); 
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Space+Grotesk:wght@700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === TEMA DEFAULT: CYBER NAVY (DARK MODE) === */
        :root { 
            --cyan-logo: #00E5FF;     
            --cyan-dark: #0077B6;     
            --yellow-logo: #FFFF00;   
            --yellow-dark: #D4AF37;   
            --navy-bg: #050B14;       
            --bg-surface: #000000;    
            
            --text-main: #FFFFFF; 
            --text-muted: #E2E8F0; 
            --danger: #EF4444; 
            --success: #10B981;
            
            --glass-bg: rgba(5, 11, 20, 0.9); 
            --glass-border: rgba(0, 229, 255, 0.4);
            --shadow-cyan: 0 10px 30px rgba(0, 229, 255, 0.25);
        }

        /* === TEMA KEDUA: SOFT BLUE (STANDAR BIRU LANGIT KC) === */
        html.theme-soft-blue {
            --cyan-logo: #0284C7; 
            --cyan-dark: #0369A1;
            --yellow-logo: #D97706; 
            --yellow-dark: #B45309;
            --navy-bg: #82C3E9; 
            --bg-surface: #E2F1FA; 
            
            --text-main: #0F172A; 
            --text-muted: #334155; 
            --danger: #DC2626; 
            --success: #059669;
            
            --glass-bg: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(2, 132, 199, 0.3);
            --shadow-cyan: 0 10px 30px rgba(2, 132, 199, 0.15);
        }

        body { 
            margin: 0; 
            background-color: var(--bg-surface);
            background-image: radial-gradient(circle at top right, var(--navy-bg) 0%, var(--bg-surface) 70%);
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            padding-bottom: 120px; 
            overflow-x: hidden; 
            position: relative; 
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        html.theme-soft-blue body { background-image: linear-gradient(180deg, #A5D6F7 0%, #F0F8FF 100%); }

        * { box-sizing: border-box; outline: none; text-decoration: none; }

        /* AMBIENT LIGHTS */
        .ambient-light { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.25; animation: floatLight 10s infinite alternate; }
        .light-1 { top: -20%; left: -20%; width: 500px; height: 500px; background: var(--cyan-dark); }
        .light-2 { top: 40%; right: -30%; width: 400px; height: 400px; background: var(--cyan-logo); animation-delay: 2s; opacity: 0.15; }
        html.theme-soft-blue .ambient-light { opacity: 0.4; }
        @keyframes floatLight { 0% {transform: translate(0,0);} 100% {transform: translate(20px, 40px);} }
        
        .header-main { padding: 40px 20px 20px; position: relative; z-index: 10; text-align: center; }
        .sub-tag { font-family: 'Space Grotesk'; font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--cyan-logo); text-transform: uppercase; margin-bottom: 5px; display: block; }
        html.theme-soft-blue .sub-tag { color: var(--cyan-dark); }
        .main-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -1px; text-shadow: 0 0 15px rgba(0,229,255,0.4); }
        html.theme-soft-blue .main-title { text-shadow: none; }

        .search-container { padding: 0 20px 20px; position: sticky; top: 0; z-index: 99; margin-top: 10px; }
        .search-box { background: rgba(5, 11, 20, 0.95); backdrop-filter: blur(15px); border-radius: 20px; padding: 5px 20px; display: flex; align-items: center; border: 2px solid rgba(0,229,255,0.3); transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        html.theme-soft-blue .search-box { background: rgba(255, 255, 255, 0.95); border: 2px solid var(--cyan-logo); box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15); }
        
        .search-box:focus-within { border-color: var(--cyan-logo); box-shadow: var(--shadow-cyan); }
        .search-box i { color: var(--cyan-logo); font-size: 20px; margin-right: 12px; }
        html.theme-soft-blue .search-box i { color: var(--cyan-dark); }
        .search-box input { flex: 1; border: none; padding: 18px 0; font-family: 'Inter'; font-size: 15px; font-weight: 800; background: transparent; color: var(--text-main); outline: none; }
        .search-box input::placeholder { color: #94A3B8; font-weight: 600; }
        html.theme-soft-blue .search-box input::placeholder { color: #64748B; }
        
        .list-container { padding: 0 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        
        /* KARTU ANGGOTA GLASS */
        .member-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); position: relative;}
        html.theme-soft-blue .member-card { background: #FFFFFF; border: 2px solid var(--glass-border); box-shadow: 0 10px 20px rgba(2, 132, 199, 0.1); }
        
        .member-card.is-pengurus { background: linear-gradient(135deg, rgba(5, 11, 20, 0.95) 0%, rgba(0, 229, 255, 0.1) 100%); border-color: var(--glass-border); border-left: 6px solid var(--cyan-logo); }
        html.theme-soft-blue .member-card.is-pengurus { background: linear-gradient(135deg, #FFFFFF 0%, rgba(2, 132, 199, 0.1) 100%); border-left: 6px solid var(--cyan-logo); border-color: var(--glass-border); }

        .m-photo-wrap { position: relative; width: 70px; height: 70px; border-radius: 18px; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.8); overflow: hidden; background: #000; transition: 0.3s;}
        html.theme-soft-blue .m-photo-wrap { border: 2px solid var(--cyan-logo); box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3); background: #FFF; }
        
        .m-photo-wrap.zoomable { cursor: zoom-in; }
        .is-pengurus .m-photo-wrap { border-color: var(--cyan-logo); box-shadow: 0 0 20px rgba(0,229,255,0.4); }
        html.theme-soft-blue .is-pengurus .m-photo-wrap { border-color: var(--cyan-logo); box-shadow: 0 0 20px rgba(2,132,199,0.3); }
        
        .m-photo-bg { position: absolute; inset: 0; background-image: url('bg_maka.jpg'); background-size: cover; background-position: center; z-index: 1; opacity: 0.6; }
        .m-photo-img { position: relative; width: 100%; height: 100%; object-fit: cover; z-index: 3; background: transparent;}
        .m-photo-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(255,255,255,0.8); z-index: 2; font-weight: 900;}
        html.theme-soft-blue .m-photo-fallback { color: rgba(2, 132, 199, 0.5); }
        
        .m-info { flex: 1; min-width: 0; position: relative;}
        
        /* KODE UNIK KANAN BAWAH */
        .m-kode { position: absolute; bottom: -5px; right: 0; font-family: 'Space Grotesk'; font-size: 14px; font-weight: 900; color: rgba(255,255,255,0.1); letter-spacing: 2px; }
        html.theme-soft-blue .m-kode { color: rgba(2, 132, 199, 0.1); }
        .is-pengurus .m-kode { color: rgba(0,229,255,0.15); }
        html.theme-soft-blue .is-pengurus .m-kode { color: rgba(2, 132, 199, 0.15); }

        .m-name { font-family: 'Outfit'; font-size: 16px; font-weight: 900; color: var(--text-main); text-transform: uppercase; margin-bottom: 4px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .m-name-wa { font-size: 11px; font-weight: 800; color: var(--cyan-logo); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        html.theme-soft-blue .m-name-wa { color: var(--cyan-dark); }
        
        .m-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; position: relative; z-index: 2;}
        .badge { font-size: 10px; font-weight: 900; padding: 5px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid transparent; }
        .bg-plat { background: rgba(0, 229, 255, 0.15); color: var(--cyan-logo); border-color: var(--cyan-logo); }
        html.theme-soft-blue .bg-plat { background: rgba(2, 132, 199, 0.1); color: var(--cyan-dark); border-color: var(--cyan-logo); }
        
        .bg-role { background: rgba(255,255,255,0.1); color: var(--text-main); border-color: rgba(255,255,255,0.3); }
        html.theme-soft-blue .bg-role { background: rgba(2, 132, 199, 0.1); color: var(--text-main); border-color: var(--cyan-logo); }
        
        .bg-admin { background: linear-gradient(90deg, var(--yellow-logo) 0%, var(--yellow-dark) 100%); color: #000; box-shadow: 0 0 15px rgba(255,255,0,0.4); font-weight: 900;}
        html.theme-soft-blue .bg-admin { color: #FFFFFF; box-shadow: none; }
        
        .m-darurat { font-size: 10px; font-weight: 900; color: white; background: var(--danger); padding: 5px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; border: 2px solid #B91C1C; box-shadow: 0 0 10px rgba(239,68,68,0.4); position: relative; z-index: 2;}
        html.theme-soft-blue .m-darurat { box-shadow: none; }

        .m-actions { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 5;}
        .btn-act { width: 42px; height: 42px; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-weight: 900;}
        .btn-call { background: var(--success); color: white; border: 2px solid #047857; box-shadow: 0 0 10px rgba(16,185,129,0.3); }
        .btn-edit { background: var(--cyan-logo); color: #000; border: 2px solid var(--cyan-dark); display: none; box-shadow: 0 0 10px rgba(0,229,255,0.3);}
        html.theme-soft-blue .btn-edit { color: #FFF; box-shadow: none; }
        .btn-del { background: var(--danger); color: white; border: 2px solid #991B1B; display: none; box-shadow: 0 0 10px rgba(239,68,68,0.3);}
        .btn-act:active { transform: scale(0.9); }
        
        /* FAB ADD & BACK BUTTON CYBERPUNK */
        .fab-add { position: fixed; bottom: 100px; right: 25px; width: 65px; height: 65px; background: var(--cyan-logo); color: #000; border-radius: 20px; display: none; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; box-shadow: var(--shadow-cyan); border: 2px solid #000; cursor: pointer; z-index: 1000; transition: 0.2s; }
        html.theme-soft-blue .fab-add { border: 2px solid var(--cyan-dark); color: #FFFFFF; box-shadow: 0 10px 25px rgba(2,132,199,0.3); }
        .fab-add:active { transform: scale(0.9); }
        
        .back-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 350px; z-index: 100; text-align: center;}
        .btn-premium-back { background: rgba(5, 11, 20, 0.95); backdrop-filter: blur(15px); border: 2px solid var(--glass-border); padding: 16px 25px; border-radius: 50px; font-family: 'Space Grotesk'; font-weight: 900; font-size: 13px; color: var(--cyan-logo); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; box-shadow: var(--shadow-cyan); letter-spacing: 1px;}
        html.theme-soft-blue .btn-premium-back { background: #FFFFFF; border: 2px solid var(--cyan-logo); color: var(--cyan-dark); box-shadow: 0 10px 25px rgba(2,132,199,0.2);}
        .btn-premium-back:active { transform: scale(0.95); }

        /* MODAL TAMBAH/EDIT DATA */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: 0.3s;}
        html.theme-soft-blue .modal-overlay { background: rgba(15, 23, 42, 0.8); }
        
        .modal-overlay.show { opacity: 1; }
        .modal-box { background: var(--navy-bg); width: 100%; max-width: 400px; border-radius: 24px; padding: 25px; border: 2px solid var(--cyan-logo); box-shadow: 0 20px 60px rgba(0,229,255,0.2); transform: scale(0.9); transition: 0.3s; max-height: 90vh; overflow-y: auto;}
        html.theme-soft-blue .modal-box { background: #FFFFFF; box-shadow: 0 20px 60px rgba(2, 132, 199, 0.3); }
        
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 900; color: var(--cyan-logo); text-transform: uppercase;}
        html.theme-soft-blue .modal-title { color: var(--cyan-dark); }
        .btn-close { background: var(--danger); border: 2px solid #991B1B; width: 35px; height: 35px; border-radius: 50%; font-size: 16px; cursor: pointer; color: white; font-weight: 900;}
        
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-label { display: block; font-size: 12px; font-weight: 900; color: var(--cyan-logo); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        html.theme-soft-blue .form-label { color: var(--cyan-dark); }
        
        .form-input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; font-family: 'Inter'; font-weight: 800; font-size: 15px; color: white; outline: none; transition: 0.2s;}
        html.theme-soft-blue .form-input { background: #FFFFFF; border: 2px solid #CBD5E1; color: var(--text-main); }
        
        .form-input:focus { border-color: var(--cyan-logo); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);}
        .upload-area { border: 2px dashed var(--cyan-logo); border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; position: relative; background: rgba(0,229,255,0.05); transition: 0.2s;}
        html.theme-soft-blue .upload-area { background: #F1F5F9; border: 2px dashed var(--cyan-logo); }
        
        .upload-area:hover { background: rgba(0,229,255,0.1); }
        .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .preview-img { width: 100%; max-height: 150px; object-fit: contain; display: none; margin-top: 10px; border-radius: 8px; border: 2px solid var(--cyan-logo);}
        .btn-submit { width: 100%; padding: 18px; border: none; border-radius: 14px; background: var(--cyan-logo); color: #000; font-family: 'Space Grotesk'; font-size: 16px; font-weight: 900; margin-top: 10px; cursor: pointer; letter-spacing: 1px; transition: 0.2s; box-shadow: var(--shadow-cyan);}
        html.theme-soft-blue .btn-submit { color: #FFF; box-shadow: 0 10px 25px rgba(2,132,199,0.3); }
        .btn-submit:active { transform: scale(0.95); }

        /* CUSTOM MODAL ALERT/CONFIRM */
        .modal-glass-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px;}
        html.theme-soft-blue .modal-glass-overlay { background: rgba(15, 23, 42, 0.8); }
        
        .modal-glass-overlay.show { opacity: 1; }
        .modal-glass-box { background: var(--navy-bg); border-radius: 25px; padding: 25px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 30px 80px rgba(0,229,255,0.2); transform: scale(0.9); transition: 0.3s; border: 2px solid var(--cyan-logo);}
        html.theme-soft-blue .modal-glass-box { background: #FFFFFF; box-shadow: 0 30px 80px rgba(2, 132, 199, 0.3); border-color: transparent;}
        
        .modal-glass-overlay.show .modal-glass-box { transform: scale(1); }
        .btn-modal-custom { padding: 16px 25px; border-radius: 14px; font-weight: 900; font-size: 14px; border: none; cursor: pointer; flex: 1; margin: 0 5px; transition: 0.2s; font-family: 'Space Grotesk'; letter-spacing: 1px;}
        .btn-modal-custom:active { transform: scale(0.95); }
        .inp-prompt { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; font-family: 'Inter'; font-size: 18px; outline: none; margin-bottom: 20px; display: none; text-align: center; font-weight: 900; transition: 0.2s;}
        html.theme-soft-blue .inp-prompt { background: #FFFFFF; color: var(--text-main); border: 2px solid #CBD5E1; }
        .inp-prompt:focus { border-color: var(--cyan-logo); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }

        /* PHOTO VIEWER (LIGHTBOX) */
        .photo-viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 20px; opacity: 0; transition: 0.3s;}
        .photo-viewer-overlay.show { opacity: 1; }
        .pv-container { position: relative; max-width: 400px; width: 100%; text-align: center; transform: scale(0.8); transition: 0.3s; }
        .photo-viewer-overlay.show .pv-container { transform: scale(1); }
        .pv-container img { width: 100%; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,229,255,0.2); object-fit: contain; max-height: 80vh; border: 3px solid var(--cyan-logo); background: #000;}
        html.theme-soft-blue .pv-container img { background: #FFF; box-shadow: 0 20px 60px rgba(2,132,199,0.3); }
        .pv-close { position: absolute; top: -15px; right: -15px; width: 45px; height: 45px; border-radius: 50%; background: var(--danger); color: white; border: 3px solid white; font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); transition: 0.2s; }
        .pv-close:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <header class="header-main">
        <span class="sub-tag">DATABASE MLKC</span>
        <h1 class="main-title">DATA ANGGOTA KC</h1>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari nama, plat, atau jabatan..." onkeyup="filterList()">
        </div>
    </div>

    <main class="list-container" id="memberList">
        <div style="text-align:center; padding:50px; color:var(--cyan-logo); font-weight: 900;"><i class="fas fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 10px; display: block;"></i> MEMBANGUN HIERARKI...</div>
    </main>

    <button class="fab-add" id="btnAdd" onclick="openModal('add')"><i class="fas fa-plus"></i></button>
    
    <div class="back-nav">
        <a href="dashboard_kc.html" class="btn-premium-back"><i class="fas fa-arrow-left"></i> KEMBALI KE DASHBOARD</a>
    </div>

    <div class="modal-overlay" id="formModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalTitleText">Tambah Anggota</div>
                <button class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <input type="hidden" id="formId">
            <input type="hidden" id="formActionType">

            <div class="form-group" id="mataDewaGroup" style="display:none; background:rgba(0,229,255,0.05); padding:15px; border-radius:14px; border:2px dashed var(--cyan-logo); margin-bottom:20px;">
                <label class="form-label" style="color: var(--cyan-logo);"><i class="fas fa-eye"></i> MATA DEWA: PIN LOGIN</label>
                <input type="text" id="formPinLogin" class="form-input" placeholder="Set PIN Baru" style="border-color: var(--cyan-logo); font-family: 'Space Grotesk'; letter-spacing: 3px; font-size: 18px; font-weight: 900; color: var(--cyan-logo);">
                <div style="font-size:10px; color:var(--text-muted); margin-top:8px; font-weight: 800;">*Hanya terlihat oleh Super Admin.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Foto Wajah</label>
                <div class="upload-area">
                    <i class="fas fa-camera" style="font-size:30px; color:var(--cyan-logo); margin-bottom:8px; display:block;"></i>
                    <div style="font-size:12px; font-weight:800; color:var(--text-main);">Tap untuk Upload (Opsional)</div>
                    <input type="file" id="formFotoInput" accept="image/png, image/jpeg" onchange="processPhoto(this)">
                    <img id="previewFoto" class="preview-img">
                </div>
            </div>

            <div class="form-group"><label class="form-label">Nama Legal (KTP)</label><input type="text" id="formNamaKtp" class="form-input" style="text-transform:uppercase;"></div>
            <div class="form-group"><label class="form-label">Nama di WA (Opsional)</label><input type="text" id="formNamaWa" class="form-input" style="text-transform:uppercase;"></div>
            <div class="form-group"><label class="form-label">Plat Nomor</label><input type="text" id="formPlat" class="form-input" style="text-transform:uppercase;"></div>
            <div class="form-group"><label class="form-label">Nomor WhatsApp</label><input type="tel" id="formHp" class="form-input"></div>
            
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Darurat (No HP)</label>
                    <input type="tel" id="formDaruratHp" class="form-input" placeholder="08xxx">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Hubungan</label>
                    <select id="formDaruratHub" class="form-input">
                        <option value="">Pilih</option>
                        <option value="ISTRI">ISTRI</option>
                        <option value="SUAMI">SUAMI</option>
                        <option value="ANAK">ANAK</option>
                        <option value="ORANG TUA">ORANG TUA</option>
                        <option value="SAUDARA">SAUDARA</option>
                        <option value="LAINNYA">LAINNYA</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Jabatan</label>
                    <select id="formRole" class="form-input">
                        <option value="MEMBER">MEMBER</option>
                        <option value="URC KC">URC KC</option>
                        <option value="BENDAHARA">BENDAHARA</option>
                        <option value="SEKRETARIS">SEKRETARIS</option>
                        <option value="HUMAS INTERNAL">HUMAS INTERNAL</option>
                        <option value="HUMAS EKSTERNAL">HUMAS EKSTERNAL</option>
                        <option value="KREATOR">KREATOR</option>
                        <option value="PENASEHAT">PENASEHAT</option>
                        <option value="PEMBINA">PEMBINA</option>
                        <option value="WAKIL KETUA">WAKIL KETUA</option>
                        <option value="KETUA UMUM">KETUA UMUM</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Divisi</label>
                    <select id="formType" class="form-input">
                        <option value="TRANSGO">TRANSGO</option>
                        <option value="RTO">RTO</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" id="btnSave" onclick="saveData()">SIMPAN DATA</button>
        </div>
    </div>

    <div class="modal-glass-overlay" id="customAlertModal">
        <div class="modal-glass-box">
            <div id="alertIcon" style="font-size: 50px; margin-bottom: 15px;"></div>
            <h3 id="alertTitle" style="font-family:'Outfit'; margin-top:0; margin-bottom:10px; font-size: 22px; color: var(--cyan-logo); font-weight: 900; text-transform: uppercase;">TITLE</h3>
            <p id="alertMessage" style="font-size:14px; color:var(--text-main); margin-bottom:20px; line-height: 1.6; font-weight: 600;"></p>
            <input type="text" id="alertInput" class="inp-prompt" placeholder="Ketik di sini...">
            <div style="display:flex; gap:10px;" id="alertBtnGroup">
                <button class="btn-modal-custom" id="btnAlertCancel" style="background:#333; color:white; display:none; border: 2px solid #555;">BATAL</button>
                <button class="btn-modal-custom" id="btnAlertOk" style="background:var(--cyan-logo); color:#000; width:100%;">OK</button>
            </div>
        </div>
    </div>

    <div class="photo-viewer-overlay" id="photoViewer" onclick="closePhoto()">
        <div class="pv-container" onclick="event.stopPropagation()">
            <img id="pvImage" src="">
            <button class="pv-close" onclick="closePhoto()"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, setDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // KONEKSI DATABASE KC NEW
        const firebaseConfig = { apiKey: "AIzaSyDfsTAGclYUSRe6YhiljS-xb-v-9RBYVEM", authDomain: "antriankcnew.firebaseapp.com", projectId: "antriankcnew" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        // ===============================================
        // SISTEM HAK AKSES ADMIN DATA ANGGOTA
        // ===============================================
        let uData = null;
        let isAdmin = false;
        let isSuperAdmin = false;

        try { 
            uData = JSON.parse(localStorage.getItem('maka_user')); 
            if(uData) {
                const plat = (uData.plat || "").replace(/\s+/g, '').toUpperCase();
                
                // HANYA 5 ORANG INI + SUPER ADMIN YANG BISA EDIT/HAPUS & ZOOM FOTO
                const allowedAdmins = [
                    "B4124SWI", // Agus Sukmana
                    "B4426SWF", // Rifky alfiansyah
                    "B4959SWF", // Alfian
                    "B4372SWJ", // FITO
                    "B4903SWG", // Dino Three
                    "B4248SWF"  // Plat Lu (Super Admin)
                ];
                
                if(allowedAdmins.includes(plat) || uData.id === "ghost_admin") {
                    isAdmin = true;
                }

                if(plat === "B4248SWF" || uData.id === "ghost_admin") {
                    isSuperAdmin = true;
                    document.getElementById('mataDewaGroup').style.display = 'block';
                }
            }
        } catch (e) {}

        if (isAdmin) {
            document.getElementById('btnAdd').style.display = 'flex';
            const style = document.createElement('style'); 
            style.innerHTML = '.btn-del, .btn-edit { display: flex !important; }'; 
            document.head.appendChild(style);
        }

        // --- SISTEM LIGHTBOX FOTO PROFIL (HANYA AKTIF JIKA ISADMIN = TRUE) ---
        window.viewPhoto = (src) => { 
            if(!isAdmin) return; // GEMBOK ZOOM FOTO UNTUK MEMBER BIASA
            if(!src || src === 'null' || src.length < 50) return;
            document.getElementById('pvImage').src = src; 
            const pv = document.getElementById('photoViewer');
            pv.style.display = 'flex'; 
            setTimeout(() => pv.classList.add('show'), 10);
        };
        
        window.closePhoto = () => { 
            const pv = document.getElementById('photoViewer');
            pv.classList.remove('show');
            setTimeout(() => pv.style.display = 'none', 300);
        };

        // --- SISTEM CUSTOM MODAL PENGGANTI ALERT & CONFIRM ---
        window.showCustomAlert = (title, message, type = 'info') => {
            return new Promise((resolve) => {
                const modal = document.getElementById('customAlertModal');
                const icon = document.getElementById('alertIcon');
                const titleEl = document.getElementById('alertTitle');
                const btnCancel = document.getElementById('btnAlertCancel');
                const btnOk = document.getElementById('btnAlertOk');
                const input = document.getElementById('alertInput');
                
                input.style.display = 'none';
                btnCancel.style.display = 'none';
                btnOk.style.width = '100%';
                btnOk.innerText = 'SAYA MENGERTI';
                
                titleEl.innerText = title;
                document.getElementById('alertMessage').innerHTML = message;
                
                if (type === 'success') {
                    icon.innerHTML = '<i class="fas fa-check-circle" style="color: var(--success); filter: drop-shadow(0 0 15px var(--success));"></i>';
                    titleEl.style.color = 'var(--success)';
                    btnOk.style.background = 'var(--success)';
                    btnOk.style.color = '#FFFFFF';
                } else if (type === 'error') {
                    icon.innerHTML = '<i class="fas fa-times-circle" style="color: var(--danger); filter: drop-shadow(0 0 15px var(--danger));"></i>';
                    titleEl.style.color = 'var(--danger)';
                    btnOk.style.background = 'var(--danger)';
                    btnOk.style.color = 'white';
                } else {
                    icon.innerHTML = '<i class="fas fa-info-circle" style="color: var(--cyan-logo); filter: drop-shadow(0 0 15px var(--cyan-logo));"></i>';
                    titleEl.style.color = 'var(--cyan-logo)';
                    btnOk.style.background = 'var(--cyan-logo)';
                    btnOk.style.color = '#000';
                }
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                
                btnOk.onclick = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    resolve(true);
                };
            });
        };

        window.showCustomConfirm = (title, message, isPrompt = false) => {
            return new Promise((resolve) => {
                const modal = document.getElementById('customAlertModal');
                const icon = document.getElementById('alertIcon');
                const titleEl = document.getElementById('alertTitle');
                const btnCancel = document.getElementById('btnAlertCancel');
                const btnOk = document.getElementById('btnAlertOk');
                const input = document.getElementById('alertInput');
                
                icon.innerHTML = '<i class="fas fa-question-circle" style="color: var(--cyan-logo); filter: drop-shadow(0 0 15px var(--cyan-logo));"></i>';
                titleEl.style.color = 'var(--cyan-logo)';
                titleEl.innerText = title;
                document.getElementById('alertMessage').innerHTML = message;
                
                btnCancel.style.display = 'block';
                btnOk.style.width = 'auto';
                btnOk.innerText = 'YA, LANJUTKAN';
                btnOk.style.background = 'var(--danger)';
                btnOk.style.color = 'white';
                btnOk.style.border = '2px solid #991B1B';
                
                if(isPrompt) {
                    input.style.display = 'block';
                    input.value = '';
                    setTimeout(() => input.focus(), 300);
                } else {
                    input.style.display = 'none';
                }
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                
                btnCancel.onclick = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    resolve(false);
                };
                
                btnOk.onclick = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    resolve(isPrompt ? input.value : true);
                };
            });
        };

        const hierarchy = { "KETUA UMUM": 1, "WAKIL KETUA": 2, "PEMBINA": 3, "PENASEHAT": 4, "SEKRETARIS": 5, "BENDAHARA": 6, "HUMAS INTERNAL": 7, "HUMAS EKSTERNAL": 8, "KREATOR": 9, "URC KC": 10, "URC": 10, "MEMBER": 11 };
        
        // BUG FIX: Mempercepat loading list data anggota dengan cache sorting
        let membersData = [];
        let currentPhotoBase64 = "";

        // BACA DATA REALTIME
        onSnapshot(collection(db, "anggota"), (snap) => {
            membersData = [];
            snap.forEach(doc => { 
                const d = doc.data();
                // Simpan rank langsung biar gausah diitung berulang-ulang
                membersData.push({ id: doc.id, _rank: (hierarchy[(d.role || "").toUpperCase()] || 12), ...d }); 
            });
            
            // SORTING SEKALI AJA DI AWAL (Kasta, lalu Abjad)
            membersData.sort((a, b) => {
                if (a._rank !== b._rank) return a._rank - b._rank;
                return (a.namaKtp || "").localeCompare(b.namaKtp || "");
            });
            
            renderList(membersData);
        });

        function renderList(data) {
            const list = document.getElementById('memberList'); 
            let htmlBuffer = ''; // Pakai buffer biar render DOM nya cepet
            
            data.forEach((m, index) => {
                const platClean = (m.plat || "").replace(/\s+/g, '').toUpperCase();
                
                // HIDE GHOST ADMIN
                if (platClean === "B4248SWF") return;

                const isPengurus = m._rank < 11;
                const hasPhoto = (m.foto && m.foto.length > 50);
                const photoHtml = hasPhoto ? `<img src="${m.foto}" class="m-photo-img" loading="lazy">` : `<div class="m-photo-fallback"><i class="fas fa-user"></i></div>`;
                
                const photoClick = (hasPhoto && isAdmin) ? `onclick="viewPhoto('${m.foto}')" class="m-photo-wrap zoomable"` : `class="m-photo-wrap"`;
                const waLink = m.hp ? `https://wa.me/62${m.hp.replace(/^0+/, '').replace(/\s+/g, '')}` : '#';

                const namaUtama = m.namaKtp || m.nama || "MEMBER KC";
                let namaWaHtml = "";
                if(m.namaWa || (m.nama && m.nama !== m.namaKtp)) {
                    const callName = m.namaWa || m.nama;
                    if(callName !== namaUtama) namaWaHtml = `<div class="m-name-wa">NAMA WA: ${callName}</div>`;
                }

                let daruratInfo = '';
                if (m.daruratHp) {
                    let hub = m.daruratHub ? `(${m.daruratHub})` : '';
                    daruratInfo = `<div class="m-darurat"><i class="fas fa-ambulance"></i> DARURAT: ${m.daruratHp} ${hub}</div>`;
                }

                const noUrut = String(index + 1).padStart(3, '0');
                const encodedData = encodeURIComponent(JSON.stringify(m));

                htmlBuffer += `
                    <div class="member-card ${isPengurus?'is-pengurus':''}">
                        <div ${photoClick}><div class="m-photo-bg"></div>${photoHtml}</div>
                        <div class="m-info">
                            <div class="m-name">${namaUtama}</div>
                            ${namaWaHtml}
                            <div class="m-badges">
                                <span class="badge bg-plat">${m.plat}</span>
                                <span class="badge bg-role">${m.type || m.vendor || 'TRANSGO'}</span>
                                ${isPengurus ? `<span class="badge bg-admin">${m.role}</span>` : ''}
                            </div>
                            ${daruratInfo}
                            <div class="m-kode">#${noUrut}</div>
                        </div>
                        <div class="m-actions">
                            <a href="${waLink}" class="btn-act btn-call" target="_blank"><i class="fab fa-whatsapp"></i></a>
                            <button class="btn-act btn-edit" style="display:${isAdmin?'flex':'none'};" onclick="openModal('edit', '${encodedData}')"><i class="fas fa-pen"></i></button>
                            <button class="btn-act btn-del" style="display:${isAdmin?'flex':'none'};" onclick="deleteMember('${m.id}', '${namaUtama}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            
            list.innerHTML = htmlBuffer || '<div style="text-align:center; padding:50px; color:var(--text-muted);">Tidak ada data anggota.</div>';
        }

        // KOMPRESI FOTO OTOMATIS KE PNG TAPI DI-RESIZE
        window.processPhoto = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                        let w = img.width; let h = img.height;
                        
                        if (w > h) { if (w > 600) { h *= 600/w; w = 600; } } else { if (h > 600) { w *= 600/h; h = 600; } }
                        
                        cvs.width = w; cvs.height = h; 
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        currentPhotoBase64 = cvs.toDataURL('image/png');
                        
                        const p = document.getElementById('previewFoto'); 
                        p.src = currentPhotoBase64; 
                        p.style.display = 'block';
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        const modal = document.getElementById('formModal');
        
        window.openModal = (type, dataString = null) => { 
            document.getElementById('formActionType').value = type;
            
            if (type === 'add') {
                document.getElementById('modalTitleText').innerText = "Tambah Anggota";
                document.getElementById('formId').value = '';
                document.getElementById('formNamaKtp').value = '';
                document.getElementById('formNamaWa').value = '';
                document.getElementById('formPlat').value = '';
                document.getElementById('formHp').value = '';
                
                document.getElementById('formDaruratHp').value = '';
                document.getElementById('formDaruratHub').value = '';

                document.getElementById('formRole').value = 'MEMBER';
                document.getElementById('formType').value = 'TRANSGO';
                document.getElementById('previewFoto').style.display = 'none';
                document.getElementById('formFotoInput').value = '';
                document.getElementById('formPinLogin').value = '';
                currentPhotoBase64 = "";
            } else if (type === 'edit' && dataString) {
                document.getElementById('modalTitleText').innerText = "Edit Anggota";
                const d = JSON.parse(decodeURIComponent(dataString));
                document.getElementById('formId').value = d.id;
                document.getElementById('formNamaKtp').value = d.namaKtp || d.nama || '';
                document.getElementById('formNamaWa').value = d.namaWa || d.nama || '';
                document.getElementById('formPlat').value = d.plat || '';
                document.getElementById('formHp').value = d.hp || '';
                
                document.getElementById('formDaruratHp').value = d.daruratHp || '';
                document.getElementById('formDaruratHub').value = d.daruratHub || '';

                document.getElementById('formRole').value = d.role || 'MEMBER';
                document.getElementById('formType').value = d.type || d.vendor || 'TRANSGO';
                
                if (isSuperAdmin) {
                    document.getElementById('formPinLogin').value = d.pin_login || d.pin || '';
                }
                
                if(d.foto && d.foto.length > 50) {
                    currentPhotoBase64 = d.foto;
                    const p = document.getElementById('previewFoto');
                    p.src = currentPhotoBase64;
                    p.style.display = 'block';
                } else {
                    currentPhotoBase64 = "";
                    document.getElementById('previewFoto').style.display = 'none';
                }
            }

            modal.style.display = 'flex'; 
            setTimeout(()=>modal.classList.add('show'), 10);
        };
        
        window.closeModal = () => { 
            modal.classList.remove('show'); 
            setTimeout(()=>modal.style.display = 'none', 300);
        };

        window.saveData = async () => {
            const namaKtp = document.getElementById('formNamaKtp').value.trim().toUpperCase();
            const namaWa = document.getElementById('formNamaWa').value.trim().toUpperCase();
            const platRaw = document.getElementById('formPlat').value.trim().toUpperCase();
            const platClean = platRaw.replace(/\s+/g, ''); 
            const hp = document.getElementById('formHp').value.trim();
            const daruratHp = document.getElementById('formDaruratHp').value.trim();
            const daruratHub = document.getElementById('formDaruratHub').value;
            const role = document.getElementById('formRole').value;
            const type = document.getElementById('formType').value;
            const actionType = document.getElementById('formActionType').value;
            const oldId = document.getElementById('formId').value;

            if(!namaKtp || !platRaw) return showCustomAlert("PERHATIAN", "Nama KTP dan Plat Nomor Wajib Diisi!", "error");

            const btn = document.getElementById('btnSave');
            btn.innerText = "MENYIMPAN..."; btn.style.opacity = '0.7';

            try {
                const newId = platClean;
                
                let payload = {
                    namaKtp: namaKtp,
                    namaWa: namaWa,
                    nama: namaWa || namaKtp, 
                    plat: platRaw,
                    hp: hp,
                    daruratHp: daruratHp,
                    daruratHub: daruratHub,
                    role: role,
                    type: type,
                };

                if (isSuperAdmin) {
                    const inputPin = document.getElementById('formPinLogin').value.trim();
                    if (inputPin !== "") {
                        payload.pin_login = inputPin;
                    }
                }

                if(currentPhotoBase64) {
                    payload.foto = currentPhotoBase64;
                }

                if (actionType === 'edit' && oldId && oldId !== newId) {
                    const oldDataIndex = membersData.findIndex(m => m.id === oldId);
                    if(oldDataIndex !== -1) {
                        const dLama = membersData[oldDataIndex];
                        payload.tabungan = dLama.tabungan || 0;
                        if(dLama.pin_tabungan) payload.pin_tabungan = dLama.pin_tabungan;
                        if(!isSuperAdmin && dLama.pin_login) payload.pin_login = dLama.pin_login;
                        if(dLama.faceDescriptor) payload.faceDescriptor = dLama.faceDescriptor;
                        if(dLama.kodeUnik) payload.kodeUnik = dLama.kodeUnik;
                    }
                    await deleteDoc(doc(db, "anggota", oldId));
                }

                await setDoc(doc(db, "anggota", newId), payload, { merge: true });

                closeModal();
                showCustomAlert("SUKSES", "Data anggota berhasil disimpan.", "success");
            } catch (e) {
                showCustomAlert("GAGAL", "Gagal menyimpan: " + e.message, "error");
            } finally {
                btn.innerText = "SIMPAN DATA"; btn.style.opacity = '1';
            }
        };

        window.deleteMember = async (id, nama) => { 
            const ok = await showCustomConfirm("HAPUS ANGGOTA", `Yakin ingin menghapus data <b>${nama}</b> secara permanen?<br><br><span style='color:var(--danger);'>Semua data Tabungan & Keamanan orang ini akan ikut hilang!</span>`);
            if(ok) {
                await deleteDoc(doc(db, "anggota", id)); 
                showCustomAlert("DIHAPUS", "Data anggota berhasil dihapus.", "success");
            }
        };

        window.filterList = () => { const txt = document.getElementById('searchInput').value.toLowerCase(); const filtered = membersData.filter(m => (m.namaKtp && m.namaKtp.toLowerCase().includes(txt)) || (m.namaWa && m.namaWa.toLowerCase().includes(txt)) || (m.plat && m.plat.toLowerCase().includes(txt)) || (m.role && m.role.toLowerCase().includes(txt))); renderList(filtered); };
    </script>
</body>
</html>
